services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lecture-db
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lecture -d lecturesearch"]
      interval: 5s
      retries: 5

volumes:
  pgdata: